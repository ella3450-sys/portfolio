<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f8f8;
    --home: #eaffb9;
    --tile: #f2f3ed;
    --serif: "EB Garamond", Garamond, "Times New Roman", serif;
    --px: calc(100vw / 1440);          /* one Figma pixel at the 1440 design width */
    --ink: #111;
    --mute: #6d6d6d;
    --frame: #e7e5e3;
    --line: #dcdcd9;
    --accent: #e0481c;
    --gut: clamp(14px, 1.1vw, 24px);
    --big: clamp(34px, 3.7vw, 86px);
    --small: clamp(14px, 1.08vw, 25px);
    --ease: cubic-bezier(.22, .7, .15, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 400; font-size: var(--small); line-height: 1.2;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  img, video { display: block; }
  h1, h2, h3, strong { font-weight: inherit; }
  ul, ol { list-style: none; }
  .big { font-size: var(--big); line-height: .95; letter-spacing: -.025em; }
  .mute { color: var(--mute); }

  /* Header: davidrinman 4-column grid */
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gut); }
  .top { position: fixed; inset: 0 0 auto 0; z-index: 20; padding: var(--gut); }
  .top .links { grid-column: 4; justify-self: end; display: flex; gap: .9em; }
  .top a:hover { color: var(--mute); }
  body.is-team .top { background: var(--bg); }
  body:not(.is-team) { background: var(--home); }
  .top .role { position: absolute; top: var(--gut); left: 50%; transform: translateX(-50%); }

  .view { opacity: 0; visibility: hidden; transition: opacity .5s ease, visibility 0s .5s; }
  .view.on { opacity: 1; visibility: visible; transition: opacity .6s ease .1s, visibility 0s; }
  .view:not(.on) { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }   /* out of the page flow while it fades */

  /* ---------- Home: davidrinman statement + mennour carousel ---------- */
  /* The homepage scrolls: statement, the row of tiles (shown whole), then the footer */
  #home { overflow: clip; }
  body:not(.is-team) .top { background: var(--home); }
  .h-head { padding: calc(83 * var(--px)) var(--gut) 0; }
  .h-statement { max-width: 18.5em; margin: 0 auto; text-align: center; line-height: 1.05; }

  /* A row of tiles at their own sizes; the active one sits in the middle */
  .stage { position: relative; margin-top: calc(48 * var(--px)); overflow: clip; cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .stage.drag { cursor: grabbing; }
  .track { display: flex; align-items: center; gap: calc(40 * var(--px)); width: max-content; will-change: transform; }
  /* mennour.com timing (300ms). The middle tile is 564px tall;
     side tiles are 360px tall. Widths follow each picture's ratio, and the size change animates with the move. */
  .track.anim { transition: transform .3s ease; }
  .tile { flex: none; width: calc(var(--r) * var(--side) * var(--px)); }
  .tile.on { width: calc(var(--r) * var(--main) * var(--px)); }
  .track { --main: 564; --side: 360; }
  .track.anim .tile { transition: width .3s ease; }
  .tile .cap {
    font-family: var(--serif); font-size: calc(18 * var(--px)); line-height: 1.33; letter-spacing: 0;
    margin-bottom: calc(12 * var(--px)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tile .cap b { font-weight: 600; }
  .tile.left .cap { text-align: right; }
  .foot { margin-top: calc(125 * var(--px)); padding: var(--gut); position: relative; }
  .foot .mid { position: absolute; top: var(--gut); left: 50%; transform: translateX(-50%); }
  .foot .links { grid-column: 4; justify-self: end; display: flex; gap: .9em; }
  .foot a:hover { color: var(--mute); }
  .tile .pic { position: relative; aspect-ratio: var(--r); background: var(--tile); overflow: hidden; }
  .tile .pic > img, .tile .pic > video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: var(--op, 50% 50%); pointer-events: none; }
  .tile .win { position: absolute; overflow: hidden; }
  .tile .win > * { position: absolute; height: auto; aspect-ratio: 16 / 9; pointer-events: none; }

  /* ---------- Team page: corentinbernadou layout ---------- */
  .t-wrap { display: grid; grid-template-columns: 30vw 1fr; }
  .t-info {
    position: sticky; top: 0; height: 100vh;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: calc(179 * var(--px)) 3vw calc(var(--gut) * 3) var(--gut);
  }
  /* Small event titles on the Events page: extra air above, close to their pictures below. */
  .ev-title { font-weight: 400; margin: calc(var(--gut) * 2) 0 calc(.7em - 3.3vw); }
  .p-head + .ev-title, .sr + .ev-title { margin-top: 0; }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ev-text { display: grid; gap: .9em; max-width: 31.6em; font-family: var(--serif); margin: calc(var(--gut) * 2) 0 calc(1.2em - 3.3vw); }
  .sr + .ev-text, .ev-title + .ev-text { margin-top: 0; }
  .ev-text a { text-decoration: underline; text-underline-offset: .2em; }
  .plist { display: grid; gap: 1.2em; justify-items: start; }
  .plist a { color: var(--mute); transition: color .3s ease; }
  .plist a:hover, .plist a[aria-current] { color: var(--ink); }
  /* The team name heads the project list, level with the page title, and links to the team's main page. */
  .t-team { display: inline-block; margin-bottom: 1.8em; color: var(--ink); font-family: var(--serif); }
  .t-team:hover { text-decoration: underline; text-underline-offset: .2em; text-decoration-thickness: 1px; }
  /* Scroll progress: a track from 0 to 100 with a dark grey fill */
  .prog #barNum { text-align: right; }
  .prog { display: grid; grid-template-columns: 1fr 3ch; align-items: center; gap: .8em; color: var(--mute); font-variant-numeric: tabular-nums; }
  .bar { height: 2px; background: var(--line); }
  .bar i { display: block; height: 100%; width: 0; background: #3a3a3a; }

  /* Team blurb at the top of the scroll */
  .blurb { display: grid; grid-template-columns: calc(200 * var(--px)) 1fr; gap: var(--gut); padding-top: .2em; min-height: calc(257 * var(--px)); align-content: start; }
  .blurb h3 { color: var(--mute); max-width: 11em; }
  .blurb .body { display: grid; gap: .9em; max-width: 31.6em; font-family: var(--serif); }
  .p-head { margin-bottom: calc(10 * var(--px) - 3.3vw); }
  /* Project pages (not the team's first): title at the top, level with the menu, its blurb below, then images */
  .t-media.proj { padding-top: calc(179 * var(--px) - .1em); }
  .p-head .p-blurb { display: grid; gap: .9em; max-width: 31.6em; font-family: var(--serif); }
  .p-head > p + .p-blurb { margin-top: 1.2em; }
  .t-media.proj .p-head { margin-bottom: calc(32 * var(--px) - 3.3vw); }   /* ~10px to the first image (cancels the column gap) */

  .t-media {
    padding: calc(176 * var(--px)) var(--gut) 0 0; display: grid; gap: 3.3vw; align-content: start; min-width: 0;
    transition: opacity .45s ease, transform .6s var(--ease);
  }
  .t-media.swap { opacity: 0; transform: translateY(16px); }

  /* Text blocks in the scroll: label on the left, text on the right */
  .tx { display: grid; grid-template-columns: 1fr 2fr; gap: var(--gut); padding-top: .2em; }
  .tx > h3 { color: var(--mute); }
  .tx .body { display: grid; gap: .9em; max-width: 34em; font-family: var(--serif); }
  .tx .lead, .tx .nums .n { font-family: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .tx .lead { font-size: calc(var(--big) * .62); line-height: 1.02; letter-spacing: -.02em; }
  .items { display: grid; gap: .9em; }
  .items li { display: grid; grid-template-columns: 1fr 1.6fr; gap: var(--gut); padding-top: .9em; border-top: 1px solid var(--line); }
  .items li.plain { grid-template-columns: 1fr; }
  .items li b { font-weight: inherit; }
  .facts { display: grid; gap: .5em; }
  .facts div { display: grid; grid-template-columns: 7em 1fr; gap: var(--gut); }
  .facts dt { color: var(--mute); }
  .nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(11em, 1fr)); gap: 1.6em var(--gut); }
  .nums .n { font-size: var(--big); line-height: .95; letter-spacing: -.025em; margin-bottom: .3em; }
  .nums p + p { margin-top: .35em; }
  .flow { display: grid; gap: .9em; counter-reset: s; }
  .flow li { padding-top: .9em; border-top: 1px solid var(--line); }
  .flow li > span { color: var(--mute); margin-right: .8em; }
  .flow ul { margin-top: .5em; color: var(--mute); }
  .p-head .big + p { margin-top: .9em; max-width: 34em; }

  .frame { display: block; }
  .frame img, .frame video { width: 100%; height: auto; }
  .frame .box { background: var(--frame); padding: 6% 20%; }   /* video at 60% of the column on a grey panel */
  .frame.pair { display: flex; gap: var(--gut); align-items: flex-start; }
  .frame.pair > * { flex: 1 1 0; min-width: 0; }
  .frame figcaption { margin-top: .6em; color: var(--mute); font-family: var(--serif); font-style: italic; font-size: .85em; }
  .next { display: block; padding: 10vh 0 calc(var(--gut) * 3); }
  .next small { display: block; color: var(--mute); font-family: var(--serif); font-size: var(--small); margin-bottom: .6em; }
  .frame .crop { object-fit: cover; }
  .next:hover .big { color: var(--mute); }
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .9s ease, transform 1.1s var(--ease); }
  .reveal.in { opacity: 1; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    .track.anim, .tile, .reveal, .t-media { transition: none; }
    .reveal { opacity: 1; transform: none; }
  }
  /* No typographic widows: big lines are balanced, body text never ends on a lone word. */
  p, li, h1, h2, h3, h4, figcaption, small, .cap { text-wrap: pretty; }
  h1, h2, .lead, .tx .nums .n, .h-statement { text-wrap: balance; }
</style>

          [{ src: "assets/books/books-shelf-2.jpg", r: 2000 / 1334 }],
          [{ src: "assets/books/books-jira.jpg", r: 1334 / 2000 }, { src: "assets/books/books-stack.jpg", r: 1334 / 2000 }],
        ] },
      // Ella's text.
      { slug: "agadot-amitiyot", title: "Agadot Amitiyot",
        blurb: ["Agadot Amitiyot (True Legends): 50 women to grow up with in Israel.",
          "The book began as a social initiative of HaMeriza, a design collective I was part of, which uses design to drive social change. We started a crowdfunding campaign that drew over 1,000 supporters and raised 145,000 shekels to create the book.",
          "Each of the 50 stories, written by Shoham Smith, is paired with an original illustration by a different Israeli illustrator, bringing together a wide range of voices, styles and techniques.",
          "My co-founders Morin Glimmer and Tal Maimon and I worked very hard on the design, production and art direction, working closely with the writer, the editor and each of the 50 illustrators.",
          "[Read about it in Portfolio](https://www.prtfl.co.il/archives/112912) \u00b7 [The book\u2019s website](https://agadot.hameriza.com/)"],
        rows: [
          [{ src: "assets/agadot/agadot-cover.jpg", r: 2000 / 1333 }],
          [{ type: "video", src: "assets/agadot/agadot-flip.mp4", poster: "assets/agadot/agadot-flip.jpg" }],
          [{ src: "assets/agadot/agadot-spread-dana.jpg", r: 1920 / 1446 }, { src: "assets/agadot/agadot-spread-karnit.jpg", r: 1920 / 1446 }],
          [{ src: "assets/agadot/agadot-spread-lea.jpg", r: 1920 / 1446 }, { src: "assets/agadot/agadot-spread-talia.jpg", r: 1920 / 1446 }],
        ] },
    ],
  },
];
// ---------------------------------------------------------

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" rel="noopener"><u>$1</u></a>');
const pad = n => String(n).padStart(2, "0");
const isVid = m => m.type === "video" || /\.mp4$/.test(m.src);
const media = (m, cls = "") => isVid(m)
  ? `<video class="${cls}" src="${m.src}" poster="${m.poster || ""}" muted loop playsinline preload="none"></video>`
  : m.r   // a crop chosen in Figma: fixed frame ratio + focus point
    ? `<img class="crop ${cls}" src="${m.src}" alt="${esc(m.alt || "")}" loading="lazy" decoding="async" style="aspect-ratio:${m.r};flex-grow:${m.r};object-position:${m.op || "50% 50%"}${m.w ? `;width:${m.w}%;margin:0 auto;display:block` : ""}">`
    : `<img class="${cls}" src="${m.src}" alt="${esc(m.alt || "")}" loading="lazy" decoding="async" onload="this.style.flexGrow=this.naturalWidth/this.naturalHeight">`;

// Play videos only while on screen.
const vio = new IntersectionObserver(es => es.forEach(e => {
  const v = e.target;
  if (e.isIntersecting && v.closest(".view.on")) { v.preload = "auto"; v.play().catch(() => {}); } else v.pause();
}), { threshold: .2 });

/* ---------- Home: a looping row of team tiles, each at its own size; the active tile is centred ---------- */
$("#hStatement").textContent = SITE.statement;
const stage = $("#stage"), track = $("#track");
const N = TEAMS.length, COPIES = 3;            // three copies so both sides always have tiles
// Left-to-right order of the tiles on the homepage (from Figma), and the one that starts in the middle.
const HOME = ["wix-templates", "wix-design-development", "base44-design", "my-own-projects"].map(s => TEAMS.find(t => t.slug === s));
const HOME_START = 1;
const tiles = [];
for (let c = 0; c < COPIES; c++) HOME.forEach((t) => {
  const i = TEAMS.indexOf(t);
  const T = t.tile, el = document.createElement("a");
  el.className = "tile";
  el.href = "#/" + t.slug;
  el.dataset.i = i;
  el.dataset.h = HOME.indexOf(t);
  el.draggable = false;
  el.style.cssText = `--w:${T.w};--r:${T.w}/${T.h};--op:${T.op || "50% 50%"}`;
  const pic = T.win
    ? `<span class="win" style="${T.win.box}">${media(T.media).replace(/^<(\w+)/, `<$1 style="${T.win.item}"`)}</span>`
    : T.media ? media(T.media) : "";
  el.innerHTML = `<p class="cap"><b>${esc(T.capName || t.name)}</b>${T.cap ? " " + esc(T.cap) : ""}</p><div class="pic">${pic}</div>`;
  if (c !== 1) el.tabIndex = -1;
  track.appendChild(el);
  tiles.push(el);
});
tiles.forEach(el => el.querySelectorAll("img").forEach(i => { i.loading = "eager"; i.onload = null; i.style.flexGrow = ""; }));
const TILE_R = tiles.map(el => { const T = HOME[el.dataset.h].tile; return T.w / T.h; });
let cur = N + HOME_START, shift = 0;                         // cur: index into tiles (middle copy = N..2N-1)

function sizeStage() {
  place(false);
}
function place(anim) {
  track.classList.toggle("anim", !!anim);
  // Work out the final layout (middle tile big, the rest small) so the move and the resize end together.
  const px = innerWidth / 1440, gap = 40 * px;
  const width = k => TILE_R[k] * (k === cur ? 564 : 360) * px;
  let left = 0;
  for (let k = 0; k < cur; k++) left += width(k) + gap;
  const x = innerWidth / 2 - (left + width(cur) / 2) + shift;
  track.style.transform = `translate3d(${x}px,0,0)`;
  tiles.forEach((t, k) => {
    t.classList.toggle("left", k < cur);
    t.classList.toggle("on", k === cur);
    const v = t.querySelector("video");
    if (v) { if (k === cur && $("#home").classList.contains("on")) { v.preload = "auto"; v.play().catch(() => {}); } else v.pause(); }
  });
}
// After a move, jump back to the middle copy without animation (same picture, so it doesn't show).
track.addEventListener("transitionend", e => {
  if (e.target !== track) return;
  const k = ((cur % N) + N) % N + N;
  if (k !== cur) { cur = k; place(false); }
});
function goTo(k) { cur = Math.max(0, Math.min(tiles.length - 1, k)); shift = 0; place(true); }
function step(dir) { goTo(cur + dir); }
function nearest() {
  const mid = innerWidth / 2;
  let best = cur, bd = Infinity;
  tiles.forEach((t, k) => { const r = t.getBoundingClientRect(), d = Math.abs(r.left + r.width / 2 - mid); if (d < bd) { bd = d; best = k; } });
  return best;
}

// Drag / swipe; a click on a side tile centres it, a click on the centre tile opens its team.
let drag = null;
stage.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  drag = { x: e.clientX, moved: false, id: e.pointerId };
});
addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (!drag.moved && Math.abs(dx) > 6) { drag.moved = true; stage.classList.add("drag"); stage.setPointerCapture(drag.id); }
  if (!drag.moved) return;
  shift = dx; place(false);
});
addEventListener("pointerup", () => {
  if (!drag) return;
  const d = drag; drag = null;
  stage.classList.remove("drag");
  if (d.moved) { const n = nearest(); goTo(n === cur && Math.abs(shift) > 60 ? cur + (shift < 0 ? 1 : -1) : n); }
});
stage.addEventListener("click", e => {
  const el = e.target.closest(".tile");
  if (!el) return;
  if (stage.dataset.justDragged) { e.preventDefault(); return; }
  const k = tiles.indexOf(el);
  if (k !== cur) { e.preventDefault(); goTo(k); }
});
stage.addEventListener("pointerup", () => { if (stage.classList.contains("drag") || shift) { stage.dataset.justDragged = 1; setTimeout(() => delete stage.dataset.justDragged, 0); } }, true);
addEventListener("pointercancel", () => { if (drag) { drag = null; stage.classList.remove("drag"); goTo(nearest()); } });
let wheelLock = 0;     // a sideways trackpad swipe moves the tiles (one step per gesture); up/down scrolls the page
$("#home").addEventListener("wheel", e => {
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  e.preventDefault();
  const d = e.deltaX;
  if (Math.abs(d) < 12 || Date.now() < wheelLock) return;
  wheelLock = Date.now() + 850;
  step(d > 0 ? 1 : -1);
}, { passive: false });
addEventListener("keydown", e => {
  if (!$("#home").classList.contains("on")) return;
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "Enter" && document.activeElement === document.body) location.hash = "#/" + TEAMS[tiles[cur].dataset.i].slug;
});

/* ---------- Text + media blocks for the right scroll (from Ella's v1 cases) ---------- */
const paras = t => [].concat(t || []).map(p => `<p>${md(p)}</p>`).join("");
function itemsHTML(list) {
  return list && list.length ? `<ul class="items">${list.map(s => {
    const m = s.match(/^\*\*(.+?)\*\*\s*(.*)$/);
    return m ? `<li><span>${esc(m[1].replace(/\.$/, ""))}</span><span>${md(m[2])}</span></li>` : `<li class="plain"><span>${md(s)}</span></li>`;
  }).join("")}</ul>` : "";
}
function factsHTML(list) {
  return list && list.length ? `<dl class="facts">${list.map(s => {
    const m = s.match(/^\*\*(.+?):\*\*\s*(.*)$/);
    return m ? `<div><dt>${esc(m[1])}</dt><dd>${md(m[2])}</dd></div>` : `<div><dt></dt><dd>${md(s)}</dd></div>`;
  }).join("")}</dl>` : "";
}
function numsHTML(stats) {
  return stats && stats.length ? `<div class="nums">${stats.map(x => `<div><p class="n">${esc(x.num)}</p><p>${md(x.text)}</p>${x.note ? `<p class="mute">${md(x.note)}</p>` : ""}${(x.items || []).map(i => `<p class="mute">${esc(i)}</p>`).join("")}</div>`).join("")}</div>` : "";
}
function flowHTML(flow) {
  return flow && flow.length ? `<ol class="flow">${flow.map((f, i) => `<li><span>${pad(i + 1)}</span>${esc(f.title)}${f.items ? `<ul>${f.items.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</li>`).join("")}</ol>` : "";
}
const tx = (label, body) => body ? `<section class="tx reveal"><h3>${esc(label || "")}</h3><div class="body">${body}</div></section>` : "";
// Media: one per row, or two per row when the v1 case showed them in two columns.
let BOXED = false;     // set while rendering a project with `boxed: true`
function mediaHTML(list, cols) {
  list = (list || []).filter(Boolean);
  const rows = [];
  if (cols === 2) for (let i = 0; i < list.length; i += 2) rows.push(list.slice(i, i + 2));
  else list.forEach(m => rows.push([m]));
  return rows.map(r => `<figure class="frame reveal${r.length > 1 ? " pair" : ""}">${BOXED && r.length === 1 && isVid(r[0]) ? `<div class="box">${media(r[0])}</div>` : r.map(m => media(m)).join("")}${r.length === 1 && r[0].caption ? `<figcaption>${esc(r[0].caption)}</figcaption>` : ""}</figure>`).join("");
}
function sectionHTML(sec, skipLabel) {
  const label = sec.big ? (/^\d+$/.test(sec.title) ? sec.big : sec.title) : sec.title;
  const body = (sec.big && !/^\d+$/.test(sec.title) ? `<p class="lead">${esc(sec.big)}</p>` : "")
    + paras(sec.text) + flowHTML(sec.flow) + itemsHTML(sec.bullets) + numsHTML(sec.stats);
  return (skipLabel ? (body ? `<section class="tx reveal"><h3></h3><div class="body">${body}</div></section>` : "") : tx(label, body))
    + mediaHTML([sec.figure, ...(sec.gallery || [])], sec.cols);
}
function outcomeHTML(cs) {
  const lead = (cs.statsLead || []).map(x => `<p class="lead">${esc(x.num)}</p><p>${md(x.text)}</p>`).join("");
  const impact = itemsHTML((cs.impact || []).map(x => `**${x.title}.** ${x.text}`));
  const body = lead + numsHTML(cs.stats) + impact;
  return body ? tx(cs.outcomeTitle || "The outcome", body) : "";
}
const rowHTML = r => `<figure class="frame reveal${r.length > 1 ? " pair" : ""}">${r.map(m => media(m)).join("")}</figure>`;
function projectBody(w, t) {
  BOXED = !!w.boxed;
  try { return projectBodyInner(w, t); } finally { BOXED = false; }
}
function projectBodyInner(w, t) {
  if (w.rows) return w.rows.map(r => r === "team" ? teamNotes(t) : typeof r === "string" ? `<h3 class="ev-title reveal">${esc(r)}</h3>`
    : r.text ? `<div class="ev-text reveal">${paras(r.text)}</div>` : rowHTML(r)).join("");
  if (!w.cs) return mediaHTML(w.media);
  const cs = CASES[w.cs];
  if (w.sec != null) return sectionHTML({ ...cs.sections[w.sec], text: null }, true);   // its text is the project blurb
  let h = mediaHTML([cs.hero]);
  h += tx(cs.contextLabel || "Context", paras(cs.context) + factsHTML(cs.role) + (cs.status ? factsHTML([`**Status:** ${cs.status}`]) : ""));
  h += mediaHTML(cs.introMedia);
  if (w.outcomeFirst) h += outcomeHTML(cs);   // the numbers come right after the first videos
  h += mediaHTML(cs.preChallengeMedia);
  if (cs.statement) h += tx("The challenge", `<p class="lead">${esc(cs.statement)}</p>` + paras(cs.challenge) + itemsHTML(cs.constraints)) + mediaHTML(cs.challengeMedia);
  if (cs.did) h += tx("What I did", itemsHTML(cs.did)) + mediaHTML(cs.didMedia);
  (cs.sections || []).forEach(sec => { h += sectionHTML(sec); });
  return w.outcomeFirst ? h : h + outcomeHTML(cs);
}
// The team blurb opens every project page of the team.
const blurbHTML = (label, text) => text && text.length
  ? `<section class="blurb reveal"><h3>${esc(label)}</h3><div class="body">${paras(text)}</div></section>` : "";
// The team's first project opens with the team blurb; every other project opens with its own blurb.
const projectBlurb = w => w.blurb || (w.sec != null ? CASES[w.cs].sections[w.sec].text : null);
// The team's own notes (leadership) and its core impact, shown on its first project.
const teamNotes = t => t.teamCase ? CASES[t.teamCase].sections.filter(s => !s.gallery).map(s => sectionHTML(s)).join("") : "";
const teamImpact = t => t.teamCase ? outcomeHTML(CASES[t.teamCase]) : "";

/* ---------- Team page (corentinbernadou: sticky left column, scrolling right column) ---------- */
const team = $("#team");
let teamObs = null, curTeam = null;
function renderTeam(t, w) {
  const i = TEAMS.indexOf(t), k = t.work.indexOf(w);
  const own = k > 0 || !(t.text && t.text.length);   // the project's own blurb, not the team's
  // The project's name shows only in the menu (a hidden heading keeps it for screen readers).
  const head = (w.cs && w.sec == null && CASES[w.cs].subtitle ? `<p>${esc(CASES[w.cs].subtitle)}</p>` : "")
    + (own && projectBlurb(w) ? `<div class="p-blurb">${paras(projectBlurb(w))}</div>` : "");
  const nextW = t.work[k + 1], nextT = TEAMS[(i + 1) % N];
  const next = nextW
    ? `<a class="next" href="#/${t.slug}/${nextW.slug}"><small>Next project</small><span class="big">${esc(nextW.title)}</span></a>`
    : `<a class="next" href="#/${nextT.slug}"><small>Next team</small><span class="big">${esc(nextT.name)}</span></a>`;
  const right = `
      ${k <= 0 ? blurbHTML(t.label || t.name, t.text) : ""}
      <h2 class="sr">${esc(w.title)}</h2>${head ? `<header class="p-head reveal">${head}</header>` : ""}
      ${projectBody(w, t)}
      ${k === 0 ? (w.rows && w.rows.includes("team") ? "" : teamNotes(t)) + teamImpact(t) : ""}
      ${next}`;
  if (curTeam === t && team.querySelector(".t-media")) {
    // Same team: only swap the project, the left column stays put.
    const box = team.querySelector(".t-media");
    team.querySelectorAll(".plist a").forEach(a => a.toggleAttribute("aria-current", a.getAttribute("href") === `#/${t.slug}/${w.slug}`));
    box.classList.add("swap");
    clearTimeout(renderTeam.t);
    renderTeam.t = setTimeout(() => {
      scrollTo(0, 0); box.innerHTML = right; box.classList.toggle("proj", own); wire();
      requestAnimationFrame(() => box.classList.remove("swap"));
    }, 420);
    return;
  }
  curTeam = t;
  team.innerHTML = `
    <div class="t-wrap">
      <aside class="t-info">
        <div class="t-menu">
          <a class="t-team" href="#/${t.slug}">${esc(t.name)}</a>
          <nav class="plist" aria-label="Projects">${t.work.map(x => `
            <a href="#/${t.slug}/${x.slug}"${x === w ? ' aria-current="page"' : ""}>
${esc(x.title)}
            </a>`).join("")}
          </nav>
        </div>
        <div class="prog" aria-hidden="true"><div class="bar"><i id="barFill"></i></div><span id="barNum">0</span></div>
      </aside>
      <div class="t-media${own ? " proj" : ""}">${right}</div>
    </div>`;
  scrollTo(0, 0);
  wire();
}
// About: the team-page shell, "About" at the top of the left column, text blocks on the right.
function renderAbout() {
  curTeam = null;
  const first = TEAMS.find(t => t.slug === HOME[HOME_START].slug);
  team.innerHTML = `
    <div class="t-wrap">
      <aside class="t-info">
        <div class="t-menu"><a class="t-team" href="#/about">About</a></div>
        <div class="prog" aria-hidden="true"><div class="bar"><i id="barFill"></i></div><span id="barNum">0</span></div>
      </aside>
      <div class="t-media proj">
        <h2 class="sr">About</h2>
        ${tx("About", `<p class="lead">${esc(ABOUT.title)}</p>` + paras(ABOUT.text))}
        ${tx("What I do", itemsHTML(ABOUT.services))}
        ${tx("Education", paras([ABOUT.education]))}
        <a class="next" href="#/${first.slug}"><small>See the work</small><span class="big">${esc(first.name)}</span></a>
      </div>
    </div>`;
  scrollTo(0, 0);
  wire();
}
function wire() {
  team.querySelectorAll("video").forEach(v => vio.observe(v));
  if (teamObs) teamObs.disconnect();
  teamObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add("in"); }), { rootMargin: "0px 0px -6% 0px" });
  team.querySelectorAll(".reveal").forEach(el => teamObs.observe(el));
  onScroll();
}
function onScroll() {
  if (!team.classList.contains("on")) return;
  const max = document.documentElement.scrollHeight - innerHeight;
  const fill = $("#barFill");
  const pct = max > 0 ? Math.min(100, Math.max(0, scrollY / max * 100)) : 0;
  if (fill) fill.style.width = pct + "%";
  const num = $("#barNum");
  if (num) num.textContent = Math.round(pct);
}
addEventListener("scroll", onScroll, { passive: true });
// Clicking the team name while already on the team's main page goes back to its top.
team.addEventListener("click", e => {
  const a = e.target.closest(".t-team");
  if (a && a.getAttribute("href") === location.hash) { e.preventDefault(); scrollTo({ top: 0, behavior: "smooth" }); }
});

/* ---------- Routing: #/team or #/team/project (first project is the default) ---------- */
function route() {
  const [slug, ps] = location.hash.replace(/^#\/?/, "").split("/");
  const t = TEAMS.find(x => x.slug === slug);
  document.querySelectorAll("video").forEach(v => v.pause());
  // About is off for now (Ella, 2026-11-13). To bring it back: add <a href="#/about">About</a> to the header links and
  // route "about" here: hide #home, renderAbout(), team.classList.add("on"), body.is-team, title "About — Ella Moscovitz".
  if (t) {
    const w = t.work.find(x => x.slug === ps) || t.work[0] || { slug: "", title: t.name, media: [] };   // a team with no projects yet
    $("#home").classList.remove("on");
    document.body.style.overflow = "";
    renderTeam(t, w);
    team.classList.add("on");
    onScroll();   // now that the view is on: progress number and team name
    document.body.classList.add("is-team");
    document.title = `${w.title === t.name ? "" : w.title + " — "}${t.name} — Ella Moscovitz`;
    // Keep the carousel on this team for the way back.
    cur = N + HOME.indexOf(t); shift = 0;
  } else {
    curTeam = null;
    team.classList.remove("on");
    document.body.classList.remove("is-team");
    $("#home").classList.add("on");
    scrollTo(0, 0);
    document.title = "Ella Moscovitz — Design Lead";
    sizeStage();
  }
}
addEventListener("hashchange", route);
addEventListener("resize", sizeStage);
document.fonts && document.fonts.ready.then(sizeStage);
addEventListener("load", sizeStage);
sizeStage();
route();
</script>
</body>
</html>
